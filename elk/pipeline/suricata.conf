input {
  http {
    host => "0.0.0.0"
    port => 8080
    ecs_compatibility => "disabled"
    codec => json
    response_code => 202
  }
}

filter {
  mutate {
    remove_field => ["headers", "host"]
  }
}

output {
  if [lab_run_id] and [lab_record_id] and [suricata][event_type] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-suricata-v1"
      document_id => "%{[lab_record_id]}"
      data_stream => "false"
      ilm_enabled => "false"
      template_api => "composable"
      template_name => "soc-suricata-v1"
      template => "/usr/share/logstash/config/suricata-template.json"
    }
  }
}
